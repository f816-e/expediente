<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e8efff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        background: white;
        padding: 25px;
        width: 320px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #23345c;
    }

    .login-box label {
        font-size: 14px;
        color: #23345c;
    }

    .login-box input {
        width: 90%;
        padding: 12px;
        border: 1px solid #bbb;
        border-radius: 8px;
        margin-top: 6px;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        background: #536dff;
        border: none;
        color: white;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .btn:hover {
        background: #4258d4;
    }
</style>
</head>
<body>
<form action="expediente.html">
    <div class="login-box">
    <h2>Iniciar sesión</h2>
    <label>Usuario:</label>
    <input type="text" placeholder="Ingresa tu usuario" required>
    <label>Contraseña:</label>
    <input type="password" placeholder="Ingresa tu contraseña" required>

    <input type="submit" class="btn" value="Acceder"></input>
</div>
</form>

</body>
</html>
